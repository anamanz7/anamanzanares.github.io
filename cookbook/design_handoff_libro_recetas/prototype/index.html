<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Libro de Recetas — un cuaderno digital</title>
<link rel="stylesheet" href="tokens.css" />

<style>
  /* ---------- Globals ---------- */
  html, body { margin: 0; height: 100%; background: #f0eee9; }
  body { font-family: var(--font-sans); }
  *, *::before, *::after { box-sizing: border-box; }

  /* el grain de las fotos se atenua/oculta vía esta var, controlada por Tweaks */
  :root { --grain-opacity: 1; }
  .ph-art svg pattern circle { opacity: var(--grain-opacity); }

  /* === Paleta del libro — sustituye los tokens del design system ===
     Los 5 colores que me pasaste + una "tinta" derivada para legibilidad
     (los reds/oranges saturados no dan contraste suficiente como texto).
     El sistema sigue siendo 3 colores rotando entre bg / text / accent. */
  :root {
    /* base palette */
    --color-beige:  #D9C8B4;
    --color-peach:  #F2B680;
    --color-orange: #F2884B;
    --color-coral:  #D95A4E;
    --color-red:    #F20505;
    --color-ink:    #2B0F0A; /* derivada — anclaje oscuro para texto */

    /* Sobreescribimos los tokens del design system con la paleta nueva
       para que --bg/--text/--accent (que rotan por tema) hereden bien. */
    --olive: var(--color-ink);    /* tinta */
    --terra: var(--color-coral);  /* coral */
    --cream: var(--color-beige);  /* beige */

    /* alias retrocompat para los SVG */
    --color-olive: var(--color-ink);
    --color-terra: var(--color-coral);
    --color-cream: var(--color-beige);
  }

  /* ---------- Densidad — sobreescritura de spacing ---------- */
  [data-density="compact"], [data-density="compact"] * {
    --sp-3: 12px; --sp-4: 14px; --sp-5: 18px;
    --sp-6: 22px; --sp-7: 28px; --sp-8: 32px;
    --sp-9: 40px; --sp-10: 48px;
  }
  [data-density="roomy"], [data-density="roomy"] * {
    --sp-3: 20px; --sp-4: 26px; --sp-5: 32px;
    --sp-6: 40px; --sp-7: 52px; --sp-8: 60px;
    --sp-9: 76px; --sp-10: 92px;
  }

  /* ---------- Primitivas ---------- */
  .ph-eyebrow {
    font-size: 13px; font-weight: 700; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--accent); margin: 0;
    transition: color var(--dur-theme) var(--ease-theme);
  }
  .ph-frame { transition: var(--t-colors); }

  /* Nav link estilo route */
  .ph-navlink {
    display: inline-flex; align-items: baseline;
    font-size: 16px; font-weight: 700; letter-spacing: 0.04em;
    color: inherit; text-decoration: none;
    padding-bottom: 6px; border-bottom: 1px solid transparent;
    transition: color var(--dur-theme) var(--ease-theme), border-color var(--dur-theme);
  }
  .ph-navlink[data-active="true"] { border-bottom-color: var(--accent); color: var(--accent); }
  .ph-navlink:hover { color: var(--accent); }

  /* Chips de filtro */
  .ph-chip {
    border: 1px solid var(--accent);
    background: transparent; color: var(--text);
    padding: 8px 14px; font: inherit;
    font-size: 14px; font-weight: 700; letter-spacing: 0.06em;
    cursor: pointer; border-radius: 0;
    transition: color var(--dur-theme), background var(--dur-theme), border-color var(--dur-theme);
  }
  .ph-chip:hover { color: var(--accent); }
  .ph-chip[data-active="true"] {
    background: var(--accent); color: var(--bg); border-color: var(--accent);
  }

  /* Tarjeta clickable index */
  .ph-card { color: inherit; text-decoration: none; transition: color var(--dur-theme); }
  .ph-card:hover h2 { color: var(--accent); }

  /* Stepper porciones */
  .ph-stepper {
    width: 36px; height: 36px; border: 1px solid var(--accent);
    background: transparent; color: var(--text);
    font-size: 20px; font-weight: 700; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    padding: 0; border-radius: 0;
    transition: background var(--dur-theme), color var(--dur-theme);
  }
  .ph-stepper:hover { background: var(--accent); color: var(--bg); }

  /* Paso clickable */
  .ph-step {
    display: flex; gap: 16px; align-items: flex-start;
    border: 0; background: transparent; color: inherit;
    text-align: left; padding: 0; cursor: pointer;
    width: 100%; font: inherit;
  }
  .ph-step[data-done="true"] { opacity: 1; }
  .ph-step[data-done="true"] > div > strong { color: var(--accent); }

  /* CTA grande */
  .ph-bigcta {
    appearance: none; border: 1px solid var(--accent);
    background: var(--accent); color: var(--bg);
    padding: 18px 26px;
    font: inherit; font-size: 20px; font-weight: 800;
    letter-spacing: -0.01em; cursor: pointer; border-radius: 0;
    display: inline-flex; gap: 16px; align-items: center; justify-content: space-between;
    transition: background var(--dur-theme), color var(--dur-theme), border-color var(--dur-theme);
  }
  .ph-bigcta:hover { background: transparent; color: var(--accent); }
  .ph-bigcta:hover > span { color: var(--accent); }
  .ph-bigcta:disabled { opacity: 1; border-color: var(--accent); background: transparent; color: var(--accent); cursor: not-allowed; }
  .ph-bigcta--ghost {
    background: transparent; color: var(--text);
  }
  .ph-bigcta--ghost:hover { background: transparent; color: var(--accent); }

  /* Input editorial — sin caja, sólo subrayado (la regla se pinta aparte) */
  .ph-input {
    appearance: none; border: 0; background: transparent;
    color: var(--text); font: inherit; font-size: 22px; font-weight: 700;
    padding: 12px 0; width: 100%; outline: none; border-radius: 0;
  }
  .ph-input--big { font-size: 40px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; }
  .ph-input--inline { padding: 8px 0; font-size: 18px; font-weight: 700; }
  .ph-input::placeholder { color: var(--accent); opacity: 1; }
  .ph-input:focus { outline: none; box-shadow: none; }
  .ph-input:focus ~ div[aria-hidden] { background: var(--text); height: 2px; }
  .ph-textarea { resize: none; min-height: 28px; height: 28px; line-height: 1.4; }
  select.ph-input {
    background: transparent; appearance: none; -webkit-appearance: none;
    padding-right: 24px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%23C4622D' d='M0 0h10L5 6z'/></svg>");
    background-repeat: no-repeat; background-position: right 0 center;
  }

  /* Search input estilo grande */
  .ph-search {
    appearance: none; border: 0; background: transparent;
    color: var(--text); font: inherit;
    font-size: 28px; font-weight: 800; letter-spacing: -0.02em;
    padding: 12px 0; width: 100%; outline: none; border-radius: 0;
  }
  .ph-search::placeholder { color: var(--accent); }

  /* Row de la lista de compra */
  .ph-shopping-row {
    width: 100%; display: flex; align-items: center; gap: 16px;
    border: 0; background: transparent; color: inherit; font: inherit;
    padding: 14px 0; cursor: pointer; text-align: left;
    border-bottom: 1px solid var(--accent);
  }
  .ph-check {
    width: 26px; height: 26px; flex-shrink: 0;
    border: 1px solid var(--accent);
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--bg); background: transparent;
    transition: background var(--dur-theme);
  }
  .ph-shopping-row[data-done="true"] .ph-check { background: var(--accent); }
  .ph-shopping-row[data-done="true"] strong { text-decoration: line-through; color: var(--accent); }

  /* FAB compra */
  .ph-fab {
    position: fixed; bottom: 28px; left: 24px; right: 24px;
    padding: 18px 22px;
    background: var(--accent); color: var(--bg);
    border: 0; font: inherit; font-size: 16px; font-weight: 800; letter-spacing: 0.16em;
    cursor: pointer; border-radius: 0;
    transition: all var(--dur-theme);
  }
  .ph-fab:hover { background: var(--text); color: var(--bg); }

  /* Quita los outlines de los enlaces tipo router dentro de artboards
     porque pintan focus-rings cuando no toca; mantenemos focus-visible */
  .ph-frame a:focus { outline: none; }
  .ph-frame a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* loader inicial */
  .booting { display:flex; align-items:center; justify-content:center; height:100vh;
    font: 700 14px/1 var(--font-sans, system-ui); letter-spacing: 0.18em; color:#665; text-transform: uppercase; }

  /* === <image-slot> overrides — que el placeholder muestre el SVG detrás
     y se integre con la tipografía editorial === */
  .ph-recipe-photo { display: block; }
  .ph-recipe-photo image-slot { width: 100%; height: 100%; display: block; }

  /* Por defecto el frame del image-slot tiene un bg gris suave;
     lo hacemos transparente para que se vea el arte SVG de detrás. */
  image-slot::part(frame) { background: transparent; }
  /* Cuando hay foto cargada, sí queremos el frame opaco (el bg del tema). */
  image-slot[data-filled]::part(frame) { background: var(--bg); }
  /* El estado vacío con el caption — usamos tipografía Syne, color tinta */
  image-slot::part(empty) {
    color: var(--color-ink);
    font-family: var(--font-sans);
    font-weight: 700;
    letter-spacing: 0.04em;
    background: rgba(0,0,0,0.04);
  }
</style>
</head>
<body>
  <div id="root"><div class="booting">cargando libro-recetas…</div></div>

</body>
